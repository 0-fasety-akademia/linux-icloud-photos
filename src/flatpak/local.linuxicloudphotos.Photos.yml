# Flatpak manifest for Linux iCloud Photos.
# @RUNTIME_VERSION@ (and @FFMPEG_VERSION@ for GNOME < 49) are filled in by build-flatpak.sh.
app-id: local.linuxicloudphotos.Photos
runtime: org.gnome.Platform
runtime-version: '@RUNTIME_VERSION@'
sdk: org.gnome.Sdk
command: linux-icloud-photos

finish-args:
  - --share=ipc
  - --share=network                    # iCloud, DLNA/Chromecast/AirPlay discovery (mDNS/SSDP)
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio                # video sound
  - --talk-name=org.freedesktop.secrets  # keyring (saved Apple ID password, AirPlay pairing)
  - --filesystem=xdg-data/icons:create    # dark/light app icon follows the system theme
  - --env=ICLOUD_PHOTOS_EMBEDDED_VIDEO=1 # mpv is not available inside the sandbox

# BEGIN-FFMPEG (used only with GNOME < 49; newer runtimes install the codecs-extra extension by themselves)
# H.264/AAC/HEVC codecs for GStreamer (needed for iCloud videos)
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '@FFMPEG_VERSION@'
    add-ld-path: .
    autodownload: true
    autodelete: false
cleanup-commands:
  - mkdir -p /app/lib/ffmpeg
# END-FFMPEG

modules:
  # Python dependencies (pyicloud, keyring, pychromecast, pyatv) - generated by build-flatpak.sh
  - python3-deps.json

  - name: linux-icloud-photos
    buildsystem: simple
    build-commands:
      - install -d /app/lib/linux-icloud-photos
      - install -m 644 app.py backend.py bridge.py cast.py cast_gc.py airplay.py exif.py pick.py i18n.py i18n_de.py i18n_uk.py version.py /app/lib/linux-icloud-photos/
      - install -Dm755 flatpak/flatpak-launcher.sh /app/bin/linux-icloud-photos
      # every command runs in its own sandbox with its own /tmp, so write straight into /app (no temp file)
      - install -d /app/share/applications
      - sed 's/^Icon=.*/Icon=local.linuxicloudphotos.Photos/' packaging/local.linuxicloudphotos.Photos.desktop > /app/share/applications/local.linuxicloudphotos.Photos.desktop
      - install -Dm644 packaging/linux-icloud-photos.svg /app/share/icons/hicolor/scalable/apps/local.linuxicloudphotos.Photos.svg
      - install -Dm644 packaging/linux-icloud-photos.svg /app/share/icons/hicolor/scalable/apps/linux-icloud-photos.svg
      - install -Dm644 packaging/icon-dark.svg /app/share/linux-icloud-photos/icon-dark.svg
      - install -Dm644 flatpak/local.linuxicloudphotos.Photos.metainfo.xml /app/share/metainfo/local.linuxicloudphotos.Photos.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/local.linuxicloudphotos.Photos/LICENSE
    sources:
      - type: dir
        path: ..
        skip:   # do not copy the builder's own working folders into the build
          - .git
          - tests
          - __pycache__
          - flatpak/build-dir
          - flatpak/.flatpak-builder
          - flatpak/.genvenv
